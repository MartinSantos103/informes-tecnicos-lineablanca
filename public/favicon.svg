<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="wrenchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Base Container con bordes suaves -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="url(#wrenchGrad)" stroke-width="6" opacity="0.4"/>
  
  <!-- Icono de Llave Inglesa Profesional -->
  <g filter="url(#shadow)" transform="translate(256, 256) rotate(-45) translate(-256, -256)">
    <!-- Cuerpo / Mango -->
    <path d="M 234,215 L 234,405 C 234,419.359 245.641,431 260,431 C 274.359,431 286,419.359 286,405 L 286,215 Z" fill="url(#wrenchGrad)"/>
    <!-- Orificio inferior del mango -->
    <circle cx="260" cy="400" r="13" fill="#0f172a"/>
    
    <!-- Cabeza exterior de la llave -->
    <path d="M 260,70 C 205,70 160,115 160,170 C 160,205 178,235 205,252 L 205,215 C 195,205 190,190 190,170 C 190,131.34 221.34,100 260,100 C 298.66,100 330,131.34 330,170 C 330,190 325,205 315,215 L 315,252 C 342,235 360,205 360,170 C 360,115 315,70 260,70 Z" fill="url(#wrenchGrad)"/>
    
    <!-- Apertura de la mordaza móvil -->
    <path d="M 235,72 L 285,72 L 285,155 L 235,155 Z" fill="#0f172a"/>
    <rect x="228" y="148" width="64" height="18" rx="4" fill="url(#accentGrad)"/>
    
    <!-- Rueda roscada sinfín (ajustador) -->
    <rect x="238" y="170" width="44" height="24" rx="4" fill="#0f172a" stroke="url(#wrenchGrad)" stroke-width="3"/>
    <line x1="248" y1="170" x2="248" y2="194" stroke="url(#wrenchGrad)" stroke-width="2"/>
    <line x1="260" y1="170" x2="260" y2="194" stroke="url(#wrenchGrad)" stroke-width="2"/>
    <line x1="272" y1="170" x2="272" y2="194" stroke="url(#wrenchGrad)" stroke-width="2"/>
  </g>
</svg>

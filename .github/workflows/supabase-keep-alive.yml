name: Supabase Keep-Alive Ping

on:
  schedule:
    # Se ejecuta todos los días a las 06:00 UTC (3:00 AM Argentina)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite ejecución manual desde GitHub Actions

jobs:
  ping:
    name: Ping Supabase Keep-Alive Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Ping
        env:
          APP_URL: ${{ secrets.VERCEL_APP_URL || 'https://informes-service-santos.vercel.app' }}
        run: |
          echo "Enviando ping de actividad a: $APP_URL/api/keep-alive"
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" "$APP_URL/api/keep-alive")
          echo "HTTP Status: $HTTP_STATUS"
          echo "Respuesta del servidor:"
          cat response.json
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "El ping falló o no devolvió código 200"
            exit 1
          fi
